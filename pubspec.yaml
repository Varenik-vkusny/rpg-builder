name: rpg_builder
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.3
  material_symbols_icons: ^4.2960.0
  share_plus: ^13.3.0
  supabase: ^2.16.1
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  share_plus_platform_interface: ^7.2.0
  plugin_platform_interface: ^2.1.8
  image_picker_platform_interface: ^2.11.1

flutter:
  uses-material-design: true
  fonts:
    - family: GolosText
      fonts:
        - asset: assets/fonts/GolosText-400.ttf
          weight: 400
        - asset: assets/fonts/GolosText-500.ttf
          weight: 500
        - asset: assets/fonts/GolosText-600.ttf
          weight: 600
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-500.ttf
          weight: 500
        - asset: assets/fonts/Unbounded-600.ttf
          weight: 600
